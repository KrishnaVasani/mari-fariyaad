# ===================================================================
# Mari-Fariyaad Spring Boot 3.x Application Configuration
# GVP Estate Complaint Management Portal
# ===================================================================

server.port=8080
spring.application.name=Mari-Fariyaad

# --- Thymeleaf Configuration ---
# Templates now live in the separate ../frontend/templates/ folder (not
# packaged on the backend's classpath), so this MUST be run with the
# working directory set to backend/ (e.g. `cd backend && mvn spring-boot:run`)
# so the relative "../frontend" path resolves correctly. Override via
# FRONTEND_DIR if you deploy frontend/ at a different location.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:${FRONTEND_DIR:../frontend}/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Force UTF-8 across every HTTP request/response (not just template
#     rendering) so Gujarati/Hindi complaint text, names, addresses, etc.
#     survive the full Frontend -> API -> DB -> API -> Frontend round trip. ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Static Resource Mapping ---
# NOTE: pattern left as the default "/**" (not "/static/**") because every
# template references assets directly as /css/..., /js/..., /lang/... (e.g.
# th:href="@{/css/custom.css}") rather than /static/css/...
# Served from ../frontend/static/ (same FRONTEND_DIR override as Thymeleaf above).
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend}/static/

# --- Database Configuration (PostgreSQL) ---
# Real JPA entities now back the app (User, PendingRegistration, PasswordResetOtp,
# Complaint, ComplaintTimeline). Override any of these via environment variables
# (DB_URL / DB_USERNAME / DB_PASSWORD) for other environments - see .env.example.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marifariyaad_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA & Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- File Upload Limits ---
# Photo <= 10MB, Video <= 50MB, both may be attached to the same complaint,
# so the combined multipart request is allowed up to ~65MB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=65MB

# --- Uploaded File Storage ---
app.upload.dir=${UPLOAD_DIR:uploads}

# --- Session Configuration ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true

