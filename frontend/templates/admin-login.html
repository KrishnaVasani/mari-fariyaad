<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Mari-Fariyaad Estate Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-dark text-light">

  <div class="d-flex justify-content-end p-2 pe-3">
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-light lang-btn" data-lang="gu" onclick="switchLanguage('gu')">ગુજરાતી</button>
      <button type="button" class="btn btn-outline-light lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
      <button type="button" class="btn btn-outline-light lang-btn" data-lang="hi" onclick="switchLanguage('hi')">हिन्दी</button>
    </div>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center my-4">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <span class="badge bg-danger p-2 px-3 fs-6 mb-2"><i class="bi bi-shield-lock-fill me-1"></i> RESTRICTED AREA</span>
          <h3 class="font-heading fw-bold text-white">Gujarat Vidyapith Estate Portal</h3>
          <p class="text-white-50 small">Administrator & Estate Officer Portal</p>
        </div>

        <div class="gvp-card p-4 p-md-5 text-dark bg-white shadow-lg">
          <h4 class="fw-bold mb-4 text-center text-dark"><i class="bi bi-shield-fill-check text-danger me-2"></i> Admin Authentication</h4>
          
          <div id="loginAlert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Admin Official Email <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                <input type="email" name="username" class="form-control" placeholder="admin@gujaratvidyapith.org" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Admin Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" class="form-control" required>
              </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 btn-lg mb-3 fw-bold"><i class="bi bi-box-arrow-in-right me-1"></i> Admin Sign In</button>
          </form>

          <div class="alert alert-secondary small mb-0 text-center">
            <i class="bi bi-info-circle me-1"></i> Authorized Estate Officers & Maintenance Supervisors only.
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="/" class="text-light-50 small text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Main Website</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/main.js" th:src="@{/js/main.js}"></script>
  <script src="/static/js/virtual-keyboard.js" th:src="@{/js/virtual-keyboard.js}"></script>
</body>
</html>
