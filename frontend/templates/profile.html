<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile | Mari-Fariyaad - Gujarat Vidyapith</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body id="profilePageContainer">

  <!-- TOP BAR & HEADER & NAV -->
  <div class="gvp-topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <div><i class="bi bi-person-fill me-1"></i> User Account & Profile Settings</div>
      <div class="d-flex align-items-center gap-3">
        <div class="btn-group btn-group-sm" role="group">
          <button type="button" class="btn btn-outline-light lang-btn" data-lang="gu" onclick="switchLanguage('gu')">ગુજરાતી</button>
          <button type="button" class="btn btn-outline-light lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
          <button type="button" class="btn btn-outline-light lang-btn" data-lang="hi" onclick="switchLanguage('hi')">हिन्दी</button>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </div>
  </div>

  <header class="gvp-header py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <img src="https://www.gujaratvidyapith.org/assets/images/gujarat-vidyapith-logo.png" alt="GVP Logo" class="gvp-logo-img" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/f/f8/Gujarat_Vidyapith_Logo.png';"/>
        <div>
          <div class="gvp-brand-title">Mari-<span>Fariyaad</span></div>
          <div class="text-muted small">User Profile Management</div>
        </div>
      </div>
    </div>
  </header>

  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container">
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/"><span data-i18n="nav_home">Home</span></a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard.html"><span data-i18n="nav_user_db">Dashboard</span></a></li>
          <li class="nav-item"><a class="nav-link" href="/complaint.html"><span data-i18n="nav_complaint">File Complaint</span></a></li>
          <li class="nav-item"><a class="nav-link" href="/track.html"><span data-i18n="nav_track">Track Status</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="gvp-card p-4 p-md-5 mb-4">
          <div class="d-flex align-items-center gap-4 border-bottom pb-4 mb-4">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center font-heading fs-2" id="profileAvatarInitials" style="width: 80px; height: 80px;">
              --
            </div>
            <div>
              <h3 class="fw-bold text-dark mb-1" id="profileFullNameHeading">Loading...</h3>
              <p class="text-muted mb-1"><i class="bi bi-person-badge me-1"></i> <span id="profileRoleLine">Campus Member</span></p>
              <span class="badge bg-success-subtle text-success border border-success"><i class="bi bi-check-circle me-1"></i> Verified Campus Member</span>
            </div>
          </div>

          <div id="profileAlert"></div>

          <form id="profileForm">
            <h5 class="fw-bold text-primary mb-3">Personal Information</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" name="fullName" class="form-control" data-virtual-keyboard="true">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Number</label>
                <input type="tel" name="mobile" class="form-control" pattern="[0-9]{10}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Role</label>
                <input type="text" name="role" class="form-control" readonly>
              </div>
            </div>

            <button type="submit" class="btn btn-gvp-primary"><i class="bi bi-check2-circle me-1"></i> Save Profile Changes</button>
          </form>

          <hr class="my-4">

          <form id="changePasswordForm">
            <h5 class="fw-bold text-primary mb-3">Change Password</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Current Password</label>
                <input type="password" name="currentPassword" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">New Password</label>
                <input type="password" name="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
              </div>
            </div>

            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-shield-lock me-1"></i> Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center small text-light-50">
      © 2026 Gujarat Vidyapith. Mari-Fariyaad User Profile.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/main.js" th:src="@{/js/main.js}"></script>
  <script src="/static/js/virtual-keyboard.js" th:src="@{/js/virtual-keyboard.js}"></script>
</body>
</html>
