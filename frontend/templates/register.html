<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Registration | Mari-Fariyaad - Gujarat Vidyapith</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-body-tertiary">

  <div class="d-flex justify-content-end p-2 pe-3">
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="gu" onclick="switchLanguage('gu')">ગુજરાતી</button>
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="hi" onclick="switchLanguage('hi')">हिन्दी</button>
    </div>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="text-center mb-4">
          <a href="/"><img src="https://www.gujaratvidyapith.org/assets/images/gujarat-vidyapith-logo.png" alt="GVP Logo" style="height: 60px;" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/f/f8/Gujarat_Vidyapith_Logo.png';"/></a>
          <h3 class="font-heading fw-bold mt-2 text-dark">User Registration</h3>
          <p class="text-muted small">Register as Student, Faculty, Staff, or Hostel Resident to manage complaints</p>
        </div>

        <div class="gvp-card p-4 p-md-5">
          <div id="registerAlert"></div>
          <form id="registerForm">
            
            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person-bounding-box me-2"></i> Account Details</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="fullName" class="form-control" placeholder="e.g. Ramesh Chandra Patel" data-virtual-keyboard="true" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address (Mandatory) <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="e.g. ramesh@gujaratvidyapith.org" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
                <input type="tel" name="mobile" class="form-control" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                <select name="gender" class="form-select" required>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
              </div>
            </div>

            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-building me-2"></i> Campus Association</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Role / Capacity <span class="text-danger">*</span></label>
                <select name="role" class="form-select" required>
                  <option value="Student">Student (વિદ્યાર્થી)</option>
                  <option value="Faculty">Faculty / Professor (અધ્યાપક)</option>
                  <option value="Staff">Staff Member (કર્મચારી)</option>
                  <option value="Hosteller">Hostel Resident (છત્રાલય નિવાસી)</option>
                  <option value="Research Scholar">Research Scholar</option>
                  <option value="Visitor">Visitor</option>
                  <option value="Other">Other Authorized Person</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Associated Department</label>
                <select name="department" class="form-select">
                  <option value="">-- Select Department --</option>
                  <option value="Computer Engineering">Computer Engineering</option>
                  <option value="Civil Engineering">Civil Engineering</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Electrical Engineering">Electrical Engineering</option>
                  <option value="IT">Information Technology</option>
                  <option value="MCA">MCA Department</option>
                  <option value="Science">Faculty of Science</option>
                  <option value="Commerce">Commerce & Management</option>
                  <option value="Arts">Faculty of Arts</option>
                  <option value="Library">Library</option>
                  <option value="Administration">Administration</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Associated Hostel</label>
                <select name="hostel" class="form-select">
                  <option value="">-- Select Hostel --</option>
                  <option value="Boys Hostel Block A">Boys Hostel Block A</option>
                  <option value="Boys Hostel Block B">Boys Hostel Block B</option>
                  <option value="Girls Hostel">Girls Hostel</option>
                  <option value="Research Scholar Hostel">Research Scholar Hostel</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Residential / Office Address on Campus</label>
                <textarea name="address" class="form-control" rows="2" placeholder="e.g. Room 12, Boys Hostel A / Staff Quarter Q-4" data-virtual-keyboard="true"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-gvp-primary btn-lg w-100 mb-3"><i class="bi bi-person-check-fill me-1"></i> Create Account</button>
          </form>

          <div class="text-center border-top pt-3 small text-muted">
            Already registered? <a href="/login.html" class="fw-bold text-primary">Login Here</a>
          </div>
        </div>

        <div class="text-center mt-3">
          <a href="/" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Home Page</a>
        </div>
      </div>
    </div>
  </div>

  <!-- OTP VERIFICATION MODAL -->
  <div class="modal fade" id="registerOtpModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock-fill text-primary me-2"></i> Verify Your Email</h5>
        </div>
        <div class="modal-body">
          <div id="registerOtpAlert"></div>
          <p class="text-muted small">We've sent a 6-digit OTP to <strong id="otpEmailLabel"></strong>. It is valid for 10 minutes.</p>
          <form id="registerOtpForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Enter OTP <span class="text-danger">*</span></label>
              <input type="text" name="otp" class="form-control form-control-lg text-center" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn btn-gvp-primary w-100"><i class="bi bi-check2-circle me-1"></i> Verify & Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/main.js" th:src="@{/js/main.js}"></script>
  <script src="/static/js/virtual-keyboard.js" th:src="@{/js/virtual-keyboard.js}"></script>
</body>
</html>
