# ===================================================================
# Mari-Fariyaad Spring Boot 3.x Application Configuration
# GVP Estate Complaint Management Portal
# ===================================================================

server.port=8080
spring.application.name=Mari-Fariyaad

# --- Thymeleaf Configuration ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Static Resource Mapping ---
# NOTE: pattern left as the default "/**" (not "/static/**") because every
# template references assets directly as /css/..., /js/..., /lang/... (e.g.
# th:href="@{/css/custom.css}") rather than /static/css/...
spring.web.resources.static-locations=classpath:/static/

# --- Database Configuration (MySQL) ---
# Real JPA entities now back the app (User, PendingRegistration, PasswordResetOtp,
# Complaint, ComplaintTimeline). Override any of these via environment variables
# (DB_URL / DB_USERNAME / DB_PASSWORD) for other environments - see .env.example.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marifariyaad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA & Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- File Upload Limits ---
# Photo <= 10MB, Video <= 50MB, both may be attached to the same complaint,
# so the combined multipart request is allowed up to ~65MB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=65MB

# --- Uploaded File Storage ---
app.upload.dir=${UPLOAD_DIR:uploads}

# --- Session Configuration ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true

# --- Email / SMTP Configuration ---
# Sourced from environment variables so no real credentials are hard-coded.
# For Gmail: host=smtp.gmail.com, port=587, TLS enabled, username=your Gmail
# address, password=a Google App Password (not your normal account password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587

