<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Login | Mari-Fariyaad - Gujarat Vidyapith</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-body-tertiary">

  <div class="d-flex justify-content-end p-2 pe-3">
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="gu" onclick="switchLanguage('gu')">ગુજરાતી</button>
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
      <button type="button" class="btn btn-outline-secondary lang-btn" data-lang="hi" onclick="switchLanguage('hi')">हिन्दी</button>
    </div>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center my-4">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a href="/">
            <img src="https://www.gujaratvidyapith.org/assets/images/gujarat-vidyapith-logo.png" alt="GVP Logo" style="height: 70px;" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/f/f8/Gujarat_Vidyapith_Logo.png';"/>
          </a>
          <h3 class="font-heading fw-bold mt-2 text-dark">Mari-Fariyaad Portal</h3>
          <p class="text-muted small">User Sign In (Spring Security & JWT Ready UI)</p>
        </div>

        <div class="gvp-card p-4 p-md-5">
          <h4 class="fw-bold mb-4 text-dark text-center"><i class="bi bi-box-arrow-in-right text-primary me-2"></i> User Login</h4>
          
          <div id="loginAlert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email / Username <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" name="username" class="form-control" placeholder="user@gujaratvidyapith.org" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label fw-semibold mb-0">Password <span class="text-danger">*</span></label>
                <a href="/forgot-password.html" class="small text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" name="remember-me" class="form-check-input" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
            </div>

            <button type="submit" class="btn btn-gvp-primary w-100 btn-lg mb-3">Sign In</button>
          </form>

          <div class="text-center border-top pt-3 small text-muted">
            Don't have an account? <a href="/register.html" class="fw-bold text-primary">Register Here</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="/" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Home Page</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
